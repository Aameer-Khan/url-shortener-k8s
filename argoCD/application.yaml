apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: url-shortener

spec:
  project: default

  source:
    repoURL: https://github.com/Aameer-Khan/url-shortener-k8s.git
    targetRevision: main
    path: kubernetes/base

  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
