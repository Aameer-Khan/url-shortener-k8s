name: URL Shortener CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 381491944316.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: url-shortener

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout Source Code
      # ------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ------------------------------------------------------------
      # Install Dependencies
      # ------------------------------------------------------------
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ------------------------------------------------------------
      # Code Quality
      # ------------------------------------------------------------
      - name: Run Linter
        run: flake8 .

      - name: Run Unit Tests
        run: pytest

      # ------------------------------------------------------------
      # Security Scan - Filesystem
      # ------------------------------------------------------------
      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      # ------------------------------------------------------------
      # Docker Setup
      # ------------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Configure AWS Authentication (OIDC)
      # ------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # Login to Amazon ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------------
      # Build & Push Docker Image
      # ------------------------------------------------------------
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64

          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------
      # Security Scan - Docker Image
      # ------------------------------------------------------------
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # ------------------------------------------------------------
      # Update GitOps Manifest
      # ------------------------------------------------------------
      - name: Update GitOps Manifest
        run: |
          sed -i "s|newTag:.*|newTag: ${{ github.sha }}|" kubernetes/base/kustomization.yaml

      # ------------------------------------------------------------
      # Commit GitOps Changes
      # ------------------------------------------------------------
      - name: Commit GitOps Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add kubernetes/base/kustomization.yaml

          git commit -m "Update image tag to ${{ github.sha }} [skip ci]" || echo "No changes to commit"

          git push
